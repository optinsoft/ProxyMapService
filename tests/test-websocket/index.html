<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Traffic Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            color: #333;
            margin: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-connect { background-color: #2ecc71; color: white; }
        .btn-connect:hover { background-color: #27ae60; }
        .btn-disconnect { background-color: #e74c3c; color: white; }
        .btn-disconnect:hover:not(:disabled) { background-color: #c0392b; }
        .btn-subscribe { background-color: #3498db; color: white; }
        .btn-subscribe:hover:not(:disabled) { background-color: #2980b9; }
        .btn-small { padding: 5px 10px; font-size: 12px; }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-disconnected { background-color: #ffe0e0; color: #cc0000; }
        .status-connected { background-color: #e0ffe0; color: #008800; }
        .session-id { margin-left: 10px; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #666; }

        /* Active subscriptions table */
        .sub-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .sub-table th, .sub-table td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }
        .sub-table th { color: #7f8c8d; font-weight: 600; font-size: 12px; text-transform: uppercase; }
        .sub-table td.mono { font-family: 'Courier New', Courier, monospace; word-break: break-all; }
        .sub-table td.num { text-align: right; width: 80px; }
        .sub-table td.actions { width: 110px; text-align: right; }
        .sub-empty { color: #999; padding: 10px 0; font-size: 13px; }
        .sub-pending { opacity: 0.6; font-style: italic; }

        .log-container {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .log-entry {
            margin-bottom: 8px;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 4px;
        }
        .log-time { color: #569cd6; }
        .log-type-matched { color: #4fc1ff; font-weight: bold; }
        .log-type-system { color: #6a9955; }
        .log-type-error { color: #f44747; }
        .log-details {
            color: #b5cea8;
            margin-left: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Connection and Configuration Section -->
    <div class="card">
        <h2>Proxy WebSocket Control Panel</h2>

        <div class="form-group">
            <input type="text" id="wsUrl" value="ws://proxymapper/session/ws" placeholder="WebSocket Server URL">
            <button id="connectBtn" class="btn-connect" onclick="toggleConnection()">Connect</button>
        </div>

        <div class="form-group">
            <input type="text" id="filterPattern" value=".*" placeholder="URL Regex Filter Pattern (e.g., api/v1/.*)">
            <button id="subscribeBtn" class="btn-subscribe" onclick="sendSubscription()" disabled>Add Subscription</button>
        </div>

        <div>
            Status: <span id="statusLabel" class="status-badge status-disconnected">Disconnected</span>
            <span id="sessionLabel" class="session-id"></span>
        </div>
    </div>

    <!-- Active subscriptions -->
    <div class="card">
        <h2>Active Subscriptions (<span id="subCount">0</span>)</h2>
        <div id="subContainer"></div>
    </div>

    <!-- Real-time Traffic Logs Section -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin: 0;">Live Traffic Interception Logs</h2>
            <button onclick="clearLogs()" style="background-color: #7f8c8d; color: white; padding: 5px 10px; font-size: 12px;">Clear Logs</button>
        </div>
        <div id="logConsole" class="log-container">
            <div class="log-entry log-type-system">System console initialized. Awaiting connection...</div>
        </div>
    </div>
</div>

<script>
    let socket = null;

    // Active subscriptions confirmed by the server: sub_id -> { pattern, matches }
    const subscriptions = new Map();

    // The server answers requests strictly in order (one reply per request), and its replies
    // to "subscribe" don't echo the pattern. So we keep a FIFO queue of sent requests
    // and pair every reply with the oldest pending request.
    // Items: { action: "subscribe", pattern } | { action: "unsubscribe", subId }
    const pendingRequests = [];

    const wsUrlInput = document.getElementById('wsUrl');
    const connectBtn = document.getElementById('connectBtn');
    const filterPatternInput = document.getElementById('filterPattern');
    const subscribeBtn = document.getElementById('subscribeBtn');
    const statusLabel = document.getElementById('statusLabel');
    const sessionLabel = document.getElementById('sessionLabel');
    const logConsole = document.getElementById('logConsole');
    const subContainer = document.getElementById('subContainer');
    const subCount = document.getElementById('subCount');

    // Pressing Enter in the pattern field adds a subscription
    filterPatternInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendSubscription();
    });

    // Main connection lifecycle controller
    function toggleConnection() {
        if (socket && socket.readyState === WebSocket.OPEN) {
            appendLog("System", "Initiating manual disconnection...");
            socket.close();
            return;
        }

        const url = wsUrlInput.value.trim();
        appendLog("System", `Connecting to ${url}...`);

        try {
            socket = new WebSocket(url);
            setupSocketEvents();
        } catch (error) {
            appendLog("Error", `Failed to instantiate WebSocket: ${error.message}`);
        }
    }

    // Configures core WebSocket event hooks
    function setupSocketEvents() {
        socket.onopen = () => {
            updateUiState(true);
            appendLog("System", "Successfully connected to Proxy WebSocket! Add a subscription to start receiving traffic.");
        };

        socket.onmessage = (event) => {
            let data;
            try {
                data = JSON.parse(event.data);
            } catch (error) {
                appendLog("System", `Received raw text message: ${event.data}`);
                return;
            }

            if (data.status === "subscribed") {
                handleSubscribed(data);
            } else if (data.status === "unsubscribed") {
                handleUnsubscribed(data);
            } else if (data.error) {
                handleError(data);
            } else if (data.event_type === "url_matched") {
                handleMatched(data);
            } else {
                appendLog("System", `Received arbitrary payload: ${event.data}`);
            }
        };

        socket.onclose = (event) => {
            updateUiState(false);
            if (event.wasClean) {
                appendLog("System", `Connection closed cleanly (Code: ${event.code}, Reason: ${event.reason || 'None'})`);
            } else {
                appendLog("Error", "Connection collapsed or was explicitly rejected by the remote host.");
            }
        };

        socket.onerror = () => {
            appendLog("Error", "An unexpected WebSocket error occurred.");
        };
    }

    // ---- Server reply handlers ----

    function handleSubscribed(data) {
        const req = pendingRequests.shift();
        const pattern = req && req.action === "subscribe" ? req.pattern : "(unknown)";
        subscriptions.set(data.sub_id, { pattern, matches: 0 });
        if (data.session_id) sessionLabel.textContent = `session: ${data.session_id}`;
        appendLog("System", `Subscribed: sub_id=${data.sub_id}, pattern=${pattern}`);
        renderSubscriptions();
    }

    function handleUnsubscribed(data) {
        pendingRequests.shift();
        const sub = subscriptions.get(data.sub_id);
        subscriptions.delete(data.sub_id);
        appendLog("System", `Unsubscribed: sub_id=${data.sub_id}${sub ? `, pattern=${sub.pattern}` : ''}`);
        renderSubscriptions();
    }

    function handleError(data) {
        const req = pendingRequests.shift();
        const what = req
            ? (req.action === "subscribe" ? `subscribe "${req.pattern}"` : `unsubscribe ${req.subId}`)
            : "unknown request";
        appendLog("Error", `Server error "${data.error}" on ${what}`);

        // The server doesn't know this sub_id (e.g. already removed) — drop it from our list too
        if (data.error === "unknown_sub_id" && data.sub_id) {
            subscriptions.delete(data.sub_id);
        }
        renderSubscriptions();
    }

    function handleMatched(data) {
        // Server may or may not tag the event with the subscription that matched it
        const sub = data.sub_id ? subscriptions.get(data.sub_id) : null;
        if (sub) sub.matches++;

        const tag = data.sub_id ? `[${data.sub_id}] ` : '';
        appendLog("Matched", `${tag}Method: ${data.method}, URL: ${data.url}`);
        if (sub) renderSubscriptions();
    }

    // ---- Client requests ----

    // Adds a NEW subscription with the pattern from the input field
    function sendSubscription() {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;

        const pattern = filterPatternInput.value.trim();
        const payload = {
            action: "subscribe",
            pattern: pattern
        };

        pendingRequests.push({ action: "subscribe", pattern });
        appendLog("System", `Requesting new subscription with regex: ${pattern}`);
        socket.send(JSON.stringify(payload));
    }

    // Removes one active subscription by its sub_id
    function sendUnsubscribe(subId) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;

        const payload = {
            action: "unsubscribe",
            sub_id: subId
        };

        pendingRequests.push({ action: "unsubscribe", subId });
        appendLog("System", `Requesting unsubscribe: ${subId}`);
        socket.send(JSON.stringify(payload));
    }

    // ---- UI ----

    // Redraws the active subscriptions table
    function renderSubscriptions() {
        subCount.textContent = subscriptions.size;
        subContainer.textContent = '';

        if (subscriptions.size === 0) {
            const empty = document.createElement('div');
            empty.className = 'sub-empty';
            empty.textContent = 'No active subscriptions.';
            subContainer.appendChild(empty);
            return;
        }

        // Sub_ids with an unsubscribe already in flight
        const removing = new Set(
            pendingRequests.filter(r => r.action === "unsubscribe").map(r => r.subId)
        );

        const table = document.createElement('table');
        table.className = 'sub-table';

        const head = table.createTHead().insertRow();
        ['Sub ID', 'Pattern', 'Matches', ''].forEach(title => {
            const th = document.createElement('th');
            th.textContent = title;
            head.appendChild(th);
        });

        const body = table.createTBody();
        for (const [subId, sub] of subscriptions) {
            const row = body.insertRow();
            if (removing.has(subId)) row.className = 'sub-pending';

            const idCell = row.insertCell();
            idCell.className = 'mono';
            idCell.textContent = subId;

            const patternCell = row.insertCell();
            patternCell.className = 'mono';
            patternCell.textContent = sub.pattern;

            const matchCell = row.insertCell();
            matchCell.className = 'num';
            matchCell.textContent = sub.matches;

            const actionCell = row.insertCell();
            actionCell.className = 'actions';
            const btn = document.createElement('button');
            btn.className = 'btn-disconnect btn-small';
            btn.textContent = 'Unsubscribe';
            btn.disabled = removing.has(subId);
            btn.onclick = () => {
                sendUnsubscribe(subId);
                renderSubscriptions(); // show "pending" state right away
            };
            actionCell.appendChild(btn);
        }

        subContainer.appendChild(table);
    }

    // Dynamic UI state mutation engine
    function updateUiState(isConnected) {
        if (isConnected) {
            statusLabel.textContent = "Connected";
            statusLabel.className = "status-badge status-connected";
            connectBtn.textContent = "Disconnect";
            connectBtn.className = "btn-disconnect";
            subscribeBtn.disabled = false;
            wsUrlInput.disabled = true;
        } else {
            statusLabel.textContent = "Disconnected";
            statusLabel.className = "status-badge status-disconnected";
            connectBtn.textContent = "Connect";
            connectBtn.className = "btn-connect";
            subscribeBtn.disabled = true;
            wsUrlInput.disabled = false;
            socket = null;

            // Subscriptions live only as long as the connection
            subscriptions.clear();
            pendingRequests.length = 0;
            sessionLabel.textContent = '';
            renderSubscriptions();
        }
    }

    // Formats and appends rows inside the visual dark console element.
    // Uses textContent everywhere so URLs/payloads from the network can't inject HTML.
    function appendLog(type, message, details = null) {
        const timestamp = new Date().toLocaleTimeString();

        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry';

        let typeClass = 'log-type-system';
        if (type === 'Matched') typeClass = 'log-type-matched';
        if (type === 'Error') typeClass = 'log-type-error';

        const timeSpan = document.createElement('span');
        timeSpan.className = 'log-time';
        timeSpan.textContent = `[${timestamp}]`;

        const typeSpan = document.createElement('span');
        typeSpan.className = typeClass;
        typeSpan.textContent = `[${type.toUpperCase()}]`;

        logEntry.append(timeSpan, ' ', typeSpan, ' ', message);

        if (details) {
            const detailsBlock = document.createElement('div');
            detailsBlock.className = 'log-details';
            detailsBlock.textContent = `Context details:\n${details}`;
            logEntry.appendChild(detailsBlock);
        }

        logConsole.appendChild(logEntry);
        logConsole.scrollTop = logConsole.scrollHeight; // Auto-scroll to latest event
    }

    function clearLogs() {
        logConsole.innerHTML = '<div class="log-entry log-type-system">Console logs cleared.</div>';
    }

    renderSubscriptions();
</script>

</body>
</html>
